name: Dagelijkse voorspelling

on:
  schedule:
    # vangnet: GitHub start deze vaak ±6 uur te laat. De echte start komt van een externe trigger
    # (cron-job.org -> workflow_dispatch om 00:20, 00:50 en 01:30 UTC). De eerste geslaagde run telt.
    - cron: "17 0 * * *"
    - cron: "17 2 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force_backtest:
        description: "Backtest opnieuw draaien (ook als hij al bestaat)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data ophalen
        run: python fetch_data.py
      - name: Voorspellen + papieren portefeuille
        run: python predict.py
      - name: Backtest (enkel als hij nog niet bestaat voor deze modelversie)
        run: python backtest.py ${{ github.event.inputs.force_backtest == 'true' && '--force' || '' }}
      - name: Committen
        run: |
          git config user.name "btc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          # enkel committen als er meer veranderde dan fetch_status.json (geen lege commits bij herhaalruns)
          if git diff --cached --name-only | grep -v '^data/fetch_status.json$' | grep -q .; then
            git commit -m "Run $(date -u +%Y-%m-%d)"
          else
            git reset -q
            echo "Niets nieuws: geen commit"
            exit 0
          fi
          git pull --rebase
          git push
